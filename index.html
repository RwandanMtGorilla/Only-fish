<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish Boids</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="home">

  <div id="boids-wrapper">
    <div id="boids-controls-container">
      <div id="mobile-boids-controls">
        <button id="animal-select-mobile">Fish</button>
        <button id="introversion-mobile">Introversion</button>
        <button id="speed-mobile">Speed</button>
        <button id="walls-mobile" class="boids-checkbox-on">Walls</button>
        <button id="collisions-mobile">Collisions</button>
        <button id="mouse-seek-mobile">Seek Mouse</button>
        <button id="feed-mode-mobile" class="boids-checkbox-on">Feed</button>
        <button id="grab-fish-mobile" class="boids-checkbox-on">Catch</button>
        <button id="show-radii-mobile">Radii</button>
        <button id="racism-mobile">Racism</button>
        <button id="diversity-mobile">Diversity</button>
      </div>
      <div class="boids-control boids-control-select">
        <select id="animal-select"></select>
      </div>
      <div id="introversion-control-container" class="boids-control boids-control-range">
        <span class="boids-control-close"></span>
        <div class="range-slider">
          <label for="introversion"><p>Introversion</p></label>
          <input class="input-range" type="range" step="1" value="10" min="0" max="20" name="introversion" id="introversion">
          <span class="range-value"></span>
        </div>
      </div>
      <div id="speed-control-container" class="boids-control boids-control-range">
        <span class="boids-control-close"></span>
        <div class="range-slider">
          <label for="speed"><p>Speed</p></label>
          <input class="input-range" type="range" step="1" value="12" min="0" max="20" name="speed" id="speed">
          <span class="range-value"></span>
        </div>
      </div>
      <div class="boids-control boids-control-checkbox">
        <div class="checkbox">
          <p>Walls</p>
          <input type="checkbox" id="walls" name="walls"/>
          <label for="walls"></label>
        </div>
      </div>
      <div class="boids-control boids-control-checkbox">
        <div class="checkbox">
          <p>Collisions</p>
          <input type="checkbox" id="collision-detection" name="collision-detection" checked/>
          <label for="collision-detection"></label>
        </div>
      </div>
      <div class="boids-control boids-control-checkbox">
        <div class="checkbox">
          <p>Seek Mouse</p>
          <input type="checkbox" id="mouse-seek" name="mouse-seek"/>
          <label for="mouse-seek"></label>
        </div>
      </div>
      <div class="boids-control boids-control-checkbox">
        <div class="checkbox">
          <p>Feed</p>
          <input type="checkbox" id="feed-mode" name="feed-mode" checked/>
          <label for="feed-mode"></label>
        </div>
      </div>
      <div class="boids-control boids-control-checkbox">
        <div class="checkbox">
          <p>Catch Fish</p>
          <input type="checkbox" id="grab-fish" name="grab-fish" checked/>
          <label for="grab-fish"></label>
        </div>
      </div>
      <div class="boids-control boids-control-checkbox">
        <div class="checkbox">
          <p>Show Radii</p>
          <input type="checkbox" id="show-radii" name="show-radii"/>
          <label for="show-radii"></label>
        </div>
      </div>
      <div id="racism-control-container" class="boids-control boids-control-range">
        <span class="boids-control-close"></span>
        <div class="range-slider">
          <label for="racism"><p>Racism</p></label>
          <input class="input-range" type="range" step="1" value="10" min="0" max="20" name="racism" id="racism">
          <span class="range-value"></span>
        </div>
      </div>
      <div id="diversity-control-container" class="boids-control boids-control-range">
        <span class="boids-control-close"></span>
        <div class="range-slider">
          <label for="diversity"><p>Diversity</p></label>
          <input class="input-range" type="range" step="1" value="3" min="1" max="8" name="diversity" id="diversity">
          <span class="range-value"></span>
        </div>
      </div>
      <div id="fps">
        <p><span id="fps-number"></span> fps</p>
      </div>
    </div>
  </div>

  <button id="toggle-controls-btn" title="Toggle Controls">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
      <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
    </svg>
  </button>

  <script type="module" src="src/main.js"></script>
</body>
</html>
